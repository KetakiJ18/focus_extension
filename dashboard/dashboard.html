<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <h1>Focus Dashboard</h1>

  <div class="stats">
    <div id="focusTime"></div>
    <div id="wasteTime"></div>
  </div>

  <h2>Productivity</h2>
  <div id="heatmap" class="grid"></div>

  <h2>Manage Distracting Sites</h2>

  <div class="site-input">
    <input id="siteInput" placeholder="Enter website (e.g. youtube.com)" />
    <button id="addSite">Add</button>
  </div>

  <ul id="siteList"></ul>

  <div class="stats">
    <div class="card">
      <h3>Focus Time</h3>
      <p id="focusTime" class="green"></p>
    </div>

    <div class="card">
      <h3>Wasted Time</h3>
      <p id="wasteTime" class="red"></p>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
